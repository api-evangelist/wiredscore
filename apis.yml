aid: wiredscore
name: WiredScore
description: 'WiredScore is the global standard-setting organization for digital connectivity and smart
  technology in the built environment. It assesses, benchmarks, and certifies buildings through two
  programs — WiredScore (digital connectivity) and SmartScore (smart building technology) — across
  office, residential, industrial, and hotel asset types. Landlords, developers, and occupiers in more
  than 40 countries use its certifications and its network of Accredited Professionals to demonstrate
  that a building meets modern technology and connectivity expectations; over 4,000 buildings covering
  roughly one billion square feet have been certified. WiredScore is a portfolio company of Bessemer
  Venture Partners and Fifth Wall. As of this enrichment pass it publishes no public API, developer
  portal, OpenAPI specification, or SDK surface.'
